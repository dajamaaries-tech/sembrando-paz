
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Cartilla digital interactiva sobre paz territorial,
          derechos humanos, convivencia y construcción de paz.">

    <meta name="author"
          content="Proyecto académico - Cátedra de la Paz">

    <meta name="theme-color" content="#20251C">

    <title>
        Sembrando Paz desde nuestro Territorio
    </title>

    <!-- CONEXIÓN CON EL ARCHIVO DE DISEÑO -->

    <link rel="stylesheet" href="./estilos.css?v=9">

    <!-- CONEXIÓN CON EL ARCHIVO DE PROGRAMACIÓN -->

    <script src="./script.js?v=9" defer></script>

    <style>

        .herramientas {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: rgba(32, 37, 28, 0.75);
            border-bottom: 1px solid rgba(233,205,145,0.25);
        }

        .herramientas button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(233,205,145,0.35);
            color: #F5E6C9;
        }

        .herramientas button:hover {
            background: #495126;
        }

        #zoom {
            color: #E9CD91;
            font-size: 14px;
            padding: 5px;
        }

        .escenario-libro {
            overflow: auto;
            padding: 12px;
        }

        .credito {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 8px;
        }

        @media (max-width: 768px) {

            .herramientas {
                padding: 8px;
                gap: 5px;
            }

            .herramientas button {
                font-size: 11px;
                padding: 8px 10px;
            }

            .escenario-libro {
                padding: 5px;
            }

        }

    </style>

</head>

<body>

    <!-- ===================================
         ENCABEZADO PRINCIPAL
    ==================================== -->

    <header>

        <button type="button"
                onclick="irPagina(1)"
                aria-label="Abrir índice">

            ☰ Índice

        </button>

        <strong>
            SEMBRANDO PAZ
        </strong>

        <button type="button"
                onclick="irPagina(0)"
                aria-label="Regresar a la portada">

            ⌂ Inicio

        </button>

    </header>


    <!-- ===================================
         HERRAMIENTAS DEL LIBRO DIGITAL
    ==================================== -->

    <nav class="herramientas"
         aria-label="Herramientas de lectura">

        <button type="button"
                onclick="pantallaCompleta()"
                title="Activar pantalla completa">

            ⛶ Pantalla completa

        </button>

        <button type="button"
                onclick="disminuirZoom()"
                title="Disminuir tamaño">

            −

        </button>

        <span id="zoom" aria-live="polite">

            100%

        </span>

        <button type="button"
                onclick="aumentarZoom()"
                title="Aumentar tamaño">

            +

        </button>

        <button type="button"
                onclick="restaurarZoom()">

            Restablecer zoom

        </button>

        <button type="button"
                id="sonido"
                onclick="activarSonido()"
                aria-pressed="false">

            🔇 Sonido

        </button>

    </nav>


    <!-- ===================================
         CONTENEDOR PRINCIPAL
    ==================================== -->

    <main class="contenedor">


        <!-- LIBRO DIGITAL -->

        <div class="escenario-libro">

            <article id="libro"
                     class="libro"
                     aria-label="Cartilla digital interactiva">

                <p>Cargando cartilla digital...</p>

            </article>

        </div>


        <!-- ===================================
             NAVEGACIÓN ENTRE PÁGINAS
        ==================================== -->

        <nav class="navegacion"
             aria-label="Navegación de páginas">

            <button type="button"
                    onclick="irPagina(0)"
                    title="Primera página">

                ⏮

            </button>

            <button type="button"
                    id="anterior"
                    onclick="cambiar(-1)">

                ◀ Anterior

            </button>

            <strong id="contador"
                    aria-live="polite">

                1 / 20

            </strong>

            <button type="button"
                    id="siguiente"
                    onclick="cambiar(1)">

                Siguiente ▶

            </button>

            <button type="button"
                    onclick="irPagina(19)"
                    title="Última página">

                ⏭

            </button>

        </nav>


        <!-- ===================================
             BARRA DE PROGRESO
        ==================================== -->

        <div class="progreso"
             aria-label="Progreso de lectura">

            <div class="barra"
                 id="barra">

            </div>

        </div>


    </main>


    <!-- ===================================
         PIE DE PÁGINA
    ==================================== -->

    <footer>

        <div>

            <strong>
                Sembrando Paz desde nuestro Territorio
            </strong>

        </div>

        <div style="margin-top:8px;">

            Cátedra de la Paz · 2026

        </div>

        <div class="credito">

            Trabajo de campo · Investigación comunitaria
            · Producción digital

        </div>

    </footer>


    <!-- MENSAJE SI JAVASCRIPT ESTÁ DESACTIVADO -->

    <noscript>

        <p style="
            background:#ffffff;
            color:#20251C;
            padding:20px;
            text-align:center;
        ">

            Para visualizar correctamente esta cartilla,
            debes activar JavaScript en tu navegador.

        </p>

    </noscript>

</body>

</html>
