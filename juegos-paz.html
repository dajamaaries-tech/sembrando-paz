<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semillas de paz | Juegos</title><style>
*{box-sizing:border-box}body{margin:0;background:#172b22;color:#fff5df;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}h1,h2{font-family:Georgia,serif;color:#f0d59b}header{border-bottom:1px solid #bda36d;padding-bottom:12px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,a.link{background:#ebce91;color:#203329;border:0;border-radius:9px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffb85a;outline-offset:2px}button.active{background:#a9d7a4}section{background:#263e30;border:1px solid #687b59;border-radius:16px;padding:clamp(10px,3vw,24px)}.board{display:grid;gap:3px;max-width:560px;margin:16px auto}.cell{padding:0;aspect-ratio:1;min-width:0;font-size:clamp(11px,3vw,20px);border-radius:4px;background:#f4e8ce}.cell.chosen{background:#f6ad50}.cell.found{background:#9fda9a}.words{display:flex;flex-wrap:wrap;gap:9px}.done{text-decoration:line-through;color:#a9d7a4}.status{min-height:32px;color:#f5d99b;font-weight:bold} .crosscell{position:relative;aspect-ratio:1;background:#e9d5a8;border-radius:3px;min-width:0}.crosscell input{width:100%;height:100%;text-align:center;border:0;background:transparent;color:#203329;font-size:clamp(12px,3vw,22px);font-weight:bold;padding:8px 0 0;text-transform:uppercase}.crosscell small{position:absolute;top:0;left:2px;color:#203329;font-size:9px;pointer-events:none}.correct{background:#9fda9a}.wrong{background:#ffb4a6}.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairgrid>div{display:grid;gap:8px;align-content:start}.pairgrid button{text-align:left;font-size:14px;min-height:58px}.pairgrid button:disabled{opacity:.65;background:#a9d7a4}.options{display:grid;gap:10px}.options button{text-align:left}textarea{width:100%;min-height:100px;padding:12px;border-radius:8px;background:#fff5df;color:#203329;font:inherit}label{display:block;margin:18px 0 6px}footer{margin:24px 0 </style><main><header><small>SEMBRANDO PAZ DESDE NUESTRO TERRITORIO</small><h1>Juega, aprende y construye paz</h1><p>Cátedra de la Paz · Universidad Popular del Cesar</p></header><nav id="nav"></nav><section id="game"></section><footer><a class="link" href="./index.html">← Volver a la cartilla</a></footer></main><script>
const letters=[["G", "A", "C", "U", "E", "R", "D", "O", "V", "H", "V", "D"], ["J", "U", "S", "T", "I", "C", "I", "A", "L", "Y", "I", "R"], ["N", "T", "X", "E", "H", "F", "Z", "Z", "F", "N", "R", "N"], ["M", "E", "M", "O", "R", "I", "A", "A", "C", "F", "E", "X"], ["K", "Z", "N", "Z", "V", "X", "D", "L", "Z", "H", "S", "I"], ["P", "F", "Z", "W", "D", "I", "U", "M", "B", "P", "P", "H"], ["G", "A", "O", "L", "A", "S", "J", "Z", "H", "H", "E", "A"], ["V", "G", "Z", "L", "I", "M", "K", "I", "C", "Y", "T", "I"], ["L", "U", "O", "O", "Q", "M", "V", "R", "K", "A", "O", "D"], ["I", "G", "N", "F", "D", "I", "G", "N", "I", "D", "A", "D"], ["O", "T", "E", "R", "R", "I", "T", "O", "R", "I", "O", "S"], ["I", "I", "G", "U", "A", "L", "D", "A", "D", "B", "D", "T"]], words=["PAZ", "RESPETO", "DIGNIDAD", "IGUALDAD", "INCLUSION", "JUSTICIA", "DIALOGO", "MEMORIA", "TERRITORIO", "ACUERDO"], entries=[{"w": "DIGNIDAD", "r": 8, "c": 6, "dr": 0, "dc": 1, "clue": "Valor inherente de cada persona."}, {"w": "DIALOGO", "r": 3, "c": 8, "dr": 1, "dc": 0, "clue": "Conversación respetuosa para comprender diferencias."}, {"w": "JUSTICIA", "r": 5, "c": 1, "dr": 0, "dc": 1, "clue": "Principio que busca garantizar derechos y equidad."}, {"w": "RESPETO", "r": 0, "c": 4, "dr": 1, "dc": 0, "clue": "Reconocimiento del valor y las diferencias de otros."}, {"w": "PAZ", "r": 3, "c": 4, "dr": 0, "dc": 1, "clue": "Convivencia sin violencia y con justicia."}, {"w": "MEMORIA", "r": 3, "c": 10, "dr": 1, "dc": 0, "clue": "Recuerdo colectivo de experiencias e historia."}, {"w": "ACUERDO", "r": 0, "c": 0, "dr": 0, "dc": 1, "clue": "Compromiso construido entre las partes."}, {"w": "IGUALDAD", "r": 1, "c": 13, "dr": 1, "dc": 0, "clue": "Reconocimiento de los mismos derechos sin discriminación."}];const names=['Sopa de letras','Crucigrama','Asociación','Decisiones','Reflexión'];const g=document.getElementById('game');let current=1;const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();function el(tag,txt,cls){let e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}function btn(t,fn,parent=g){let b=el('button',t);b.onclick=fn;parent.append(b);return b}function base(t,desc){g.replaceChildren(el('h2',t),el('p',desc));let s=el('p','','status');s.setAttribute('aria-live','polite');g.append(s);return s}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function launch(i){current=i;history.replaceState(null,'','?j='+i);document.querySelectorAll('nav button').forEach((b,k)=>b.classList.toggle('active',k===i-1));[soup,cross,match,decide,reflect][i-1]()}names.forEach((n,i)=>btn(n,()=>launch(i+1),document.getElementById('nav')));
function soup(){let s=base('Encontrando las semillas de la paz','Selecciona la primera y la última letra de una palabra en línea recta. Puede estar en cualquier dirección.');let list=el('div','','words'), found=new Set(), start=null, cells=[];words.forEach(w=>list.append(el('span',w)));g.append(list);let b=el('div','','board');b.style.gridTemplateColumns='repeat(12,minmax(0,1fr))';g.append(b);letters.flat().forEach((x,k)=>{let c=btn(x,()=>{if(start===null){start=k;c.classList.add('chosen');return}let a=start;cells[a].classList.remove('chosen');start=null;let r=Math.floor(a/12),q=a%12,dr=Math.floor(k/12)-r,dc=k%12-q;if((!dr&&!dc)||(dr&&dc&&Math.abs(dr)!==Math.abs(dc))){s.textContent='Selecciona una línea recta.';return}let ids=Array.from({length:Math.max(Math.abs(dr),Math.abs(dc))+1},(_,j)=>(r+j*Math.sign(dr))*12+q+j*Math.sign(dc));let w=ids.map(z=>letters.flat()[z]).join('');if(!words.includes(w))w=[...w].reverse().join('');if(words.includes(w)&&!found.has(w)){found.add(w);ids.forEach(z=>cells[z].classList.add('found'));[...list.children].find(x=>x.textContent===w).classList.add('done');s.textContent=found.size===words.length?'¡Excelente! Encontraste todas las palabras.':`¡Encontraste ${w}! ${found.size}/${words.length}`;}else s.textContent='Intenta otra palabra.'},b);c.className='cell';c.setAttribute('aria-label',`Fila ${Math.floor(k/12)+1}, columna ${k%12+1}: ${x}`);cells.push(c)});btn('Reiniciar',soup)}
function cross(){let s=base('Palabras que construyen paz','Escribe una letra por casilla. Utiliza las pistas horizontales y verticales; no necesitas tildes.');let map=new Map(), inputs=new Map();entries.forEach((e,i)=>{e.num=i+1;[...e.w].forEach((x,j)=>map.set(`${e.r+j*e.dr},${e.c+j*e.dc}`,x))});let R=Math.max(...[...map.keys()].map(k=>+k.split(',')[0]))+1,C=Math.max(...[...map.keys()].map(k=>+k.split(',')[1]))+1;let b=el('div','','board');b.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;g.append(b);for(let r=0;r<R;r++)for(let c=0;c<C;c++){let k=`${r},${c}`,d=el('div');b.append(d);if(!map.has(k))continue;d.className='crosscell';let ns=entries.filter(e=>e.r===r&&e.c===c).map(e=>e.num);if(ns.length)d.append(el('small',ns.join('/')));let inp=el('input');inp.maxLength=1;inp.autocomplete='off';inp.setAttribute('aria-label',`Fila ${r+1}, columna ${c+1}`);inp.oninput=()=>{inp.value=norm(inp.value).replace(/[^A-Z]/g,'');d.classList.remove('correct','wrong')};inp.onkeydown=e=>{let delta={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(delta){e.preventDefault();inputs.get(`${r+delta[0]},${c+delta[1]}`)?.focus()}};d.append(inp);inputs.set(k,inp)}for(let dr of [0,1]){g.append(el('h3',dr?'Verticales':'Horizontales'));entries.filter(e=>e.dr===dr).forEach(e=>g.append(el('p',`${e.num}. ${e.clue} (${e.w.length} letras)`)))}btn('Comprobar',()=>{let score=0;inputs.forEach((v,k)=>{let ok=v.value===map.get(k);score+=ok;v.parentNode.classList.toggle('correct',ok);v.parentNode.classList.toggle('wrong',!ok)});s.textContent=score===map.size?'¡Crucigrama completo!':`${score}/${map.size} letras correctas.`});btn('Reiniciar',cross)}
const pairs=[['Dignidad','Valor inherente de cada persona.'],['Mediación','Acompañamiento imparcial para facilitar una solución.'],['Inclusión','Participación de todas las personas sin exclusión.'],['Memoria','Reconocimiento de la historia y las experiencias colectivas.'],['Diálogo','Escucha e intercambio respetuoso de ideas.'],['Justicia social','Condiciones equitativas y acceso efectivo a derechos.']];function match(){let s=base('Conectando saberes','Selecciona un concepto y luego su definición.');let a=el('div','','pairgrid'),l=el('div'),r=el('div');a.append(l,r);g.append(a);let selected=null,count=0,lb=[];pairs.forEach((p,i)=>{lb[i]=btn(p[0],()=>{lb.forEach(b=>b.classList.remove('active'));selected=i;lb[i].classList.add('active')},l)});shuffle(pairs.map((p,i)=>i)).forEach(i=>{let b=btn(pairs[i][1],()=>{if(selected===null){s.textContent='Primero elige un concepto.';return}if(selected===i){b.disabled=lb[i].disabled=true;lb[i].classList.remove('active');selected=null;count++;s.textContent=count===pairs.length?'¡Todas las parejas correctas!':`¡Correcto! ${count}/${pairs.length}`}else s.textContent='Esa definición no corresponde. Vuelve a intentarlo.'},r)});btn('Reiniciar',match)}
const cases=[['Dos estudiantes se burlan de una tradición cultural de un compañero.',['Ignorar las burlas.','Detener las burlas, escuchar al compañero y promover respeto con apoyo docente.','Responder con insultos.'],1,'La inclusión requiere detener la discriminación y proteger la dignidad.'],['Dos familias discrepan sobre el uso de una fuente de agua.',['Dialogar y buscar un acuerdo con apoyo de autoridades propias.','Imponer una decisión por la fuerza.','Difundir rumores.'],0,'El diálogo y los acuerdos pueden proteger el bien común.'],['En un trabajo grupal no dejan participar a una estudiante.',['Hacer todo sin ella.','Dejar que se retire.','Distribuir responsabilidades y escuchar sus ideas.'],2,'La participación equitativa fortalece la convivencia.'],['Una persona recibe amenazas graves.',['Pedirle que negocie sola.','Buscar protección y acudir a autoridades competentes.','Restar importancia.'],1,'La seguridad y los derechos son prioritarios; no toda violencia se resuelve negociando.'],['Dos vecinos discuten por el ruido.',['Escuchar necesidades y acordar horarios.','Amenazar al vecino.','Publicar insultos.'],0,'Los acuerdos concretos y respetuosos ayudan a prevenir nuevos conflictos.']];function decide(){let s=base('Decisiones que transforman','Selecciona la alternativa que mejor protege los derechos y la convivencia. Situaciones hipotéticas.');let area=el('div');g.append(area);let i=0,score=0;function next(){area.replaceChildren();if(i===cases.length){area.append(el('h3',`Resultado: ${score}/${cases.length}`));btn('Volver a jugar',decide,area);return}let [q,opts,ok,why]=cases[i];s.textContent=`Situación ${i+1}/${cases.length}`;area.append(el('h3',q));let o=el('div','','options');area.append(o);opts.forEach((t,j)=>btn(t,()=>{[...o.children].forEach(b=>b.disabled=true);if(j===ok)score++;s.textContent=(j===ok?'¡Correcto! ':'Revisa tu elección. ')+why;btn('Continuar',()=>{i++;next()},area)},o))}next()}
const prompts=['¿Cómo puedes promover el respeto por la identidad cultural en tu aula?','¿Qué relación encuentras entre territorio, memoria y paz?','¿Qué harías ante una situación de exclusión en tu comunidad?','¿Cómo contribuye la restitución de derechos a la construcción de paz?','Escribe un compromiso concreto para mejorar la convivencia.'];function reflect(){let s=base('Piensa, reflexiona y siembra paz','Responde con tus propias palabras. No hay una única respuesta correcta. Las respuestas no se envían a ningún servidor.');let fields=[];prompts.forEach((q,i)=>{let l=el('label',`${i+1}. ${q}`);l.htmlFor='r'+i;let t=el('textarea');t.id='r'+i;g.append(l,t);fields.push(t)});btn('Descargar mis reflexiones',()=>{if(!fields.some(t=>t.value.trim())){s.textContent='Escribe al menos una reflexión.';return}let url=URL.createObjectURL(new Blob([prompts.map((q,i)=>q+'\n'+fields[i].value).join('\n\n')],{type:'text/plain;charset=utf-8'}));let a=el('a');a.href=url;a.download='mis-reflexiones-de-paz.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.textContent='Reflexiones preparadas para descargar.'});btn('Limpiar respuestas',()=>{fields.forEach(t=>t.value='');s.textContent='Respuestas eliminadas.'})}launch(Math.min(5,Math.max(1,Number(new URLSearchParams(location.search).get('j'))||1)));
